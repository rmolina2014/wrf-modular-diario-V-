[project]
name = "tesis-wrf-pgich"
version = "0.2.0"
description = "Sistema de Asimilación de Observaciones Meteorológicas PGICH en el Modelo WRF (FDDA / Obs Nudging)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "matplotlib>=3.10.0",
    "metpy>=1.7.0",
    "netcdf4>=1.7.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pydeck>=0.9.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scipy>=1.14.0",
    "streamlit>=1.35.0",
    "uvicorn>=0.28.0",
    "xarray>=2024.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
